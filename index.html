  $('#play').disabled = !t;
  $('#play').classList.toggle('playing', state.playing);
  $('#play').innerHTML = state.playing ? '❚❚ Pause' : '▶▶ Auto';
}

/* ---------------- foreign-key rules (for UPDATE / DELETE) ---------------- */
const RULES = ['CASCADE', 'SET NULL', 'RESTRICT'];
const isDML = () => /^\s*(--[^\n]*\n\s*)*(DELETE|UPDATE)\b/i.test(ta.value);
const rulesNow = () => (state.rules[state.ds] = state.rules[state.ds] || {});
function renderFks() {
  const box = $('#fks');
  const fks = DATASETS[state.ds].fks || [];
  if (!isDML() || !fks.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const s = state.trace ? state.trace.steps[state.i] : null;
  const opt = (key, kind) => {
    const v = (rulesNow()[key] || {})[kind] || 'RESTRICT';
    return `<select data-fk="${esc(key)}" data-kind="${kind}">${RULES.map(r => `<option ${r === v ? 'selected' : ''}>${r}</option>`).join('')}</select>`;
  };
  box.innerHTML = '<div class="fk-title">Foreign keys</div>' + fks.map(f => {
    const key = `${f.child}.${f.col}`;
    return `<div class="fkrow ${s && s.fkKey === key ? 'on' : ''}"><code>${esc(f.child)}.${esc(f.col)} → ${esc(f.parent)}.${esc(f.pcol)}</code>
      <label>ON DELETE ${opt(key, 'del')}</label><label>ON UPDATE ${opt(key, 'upd')}</label></div>`;
  }).join('');
}

/* ---------------- easter eggs ---------------- */
function eggContext() {
  const vals = new Set();
  let hasNull = false;
  state.trace.result.rows.forEach(r => r.vals.forEach(v => { if (v === null) hasNull = true; else vals.add(String(v)); }));
  return { has: v => vals.has(v), hasNull, sql: ta.value };
}
function maybeEgg() {
  const t = state.trace;
  if (!t || state.eggShown || !$('#eggs').checked || state.i !== t.steps.length - 1) return;
  const ctx = eggContext();
  const egg = (DATASETS[state.ds].eggs || []).find(e => { try { return e.when(ctx); } catch (_) { return false; } });
  if (!egg) return;
  state.eggShown = true;
  showEgg(egg.lines);
}
function showEgg(lines) {
  const box = $('#egg');
  box.innerHTML = '<button class="egg-x" aria-label="Close">×</button>';
  box.hidden = false;
  clearTimeout(state.eggTimer);
  let k = 0;
  const say = () => {
    if (k >= lines.length) return;
    const [who, text] = lines[k];
    const b = document.createElement('div');
    b.className = `bubble ${k % 2 ? 'b-right' : 'b-left'}`;
    b.innerHTML = `<span class="who">${esc(who)}</span><div class="said">${esc(text)}</div>`;
    box.appendChild(b);
    k++;
    state.eggTimer = setTimeout(say, 2600);
  };
  say();
}
function hideEgg() { clearTimeout(state.eggTimer); $('#egg').hidden = true; $('#egg').innerHTML = ''; }

/* ---------------- actions ---------------- */
function clauseFromPos(src, pos) {
  let cl = null;
  const toks = tokenize(src, true);
  for (let k = 0; k < toks.length && toks[k].s <= pos; k++) {
    const t = toks[k];
    if (t.t !== 'kw') continue;
    if (['SELECT', 'FROM', 'WHERE', 'HAVING', 'ON'].includes(t.up)) cl = t.up;
    if (t.up === 'JOIN') cl = 'FROM';
    if (t.up === 'GROUP') cl = 'GROUP BY';
    if (t.up === 'ORDER') cl = 'ORDER BY';
  }
  return cl;
}
function run() {
  stop();
  hideEgg();
  state.eggShown = false;
  state.dirty = false;
  try {
    state.trace = buildTrace(ta.value, { rowByRow: $('#rowbyrow').checked, rules: rulesNow() });
    state.i = 0;
    state.err = null;
    state.lastRunText = ta.value;
  } catch (e) {
    state.trace = null;
    if (!(e instanceof SqlError)) { console.error(e); e = new SqlError('Something unexpected went wrong with this query: ' + e.message, null); }
    if (!e.clause && e.s !== undefined) e.clause = clauseFromPos(ta.value, e.s);
    state.err = e;
  }
  render();
}
function reset() { hideEgg(); stop(); state.trace = null; state.err = null; state.dirty = false; render(); }
function go(i) {
  if (!state.trace) return;
  const n = state.trace.steps.length;
  i = Math.max(0, Math.min(n - 1, i));
  if (i === state.i) return;
  state.i = i;
  render();
}
function stop() { state.playing = false; clearTimeout(state.timer); updateControls(); }
function tick() {
  if (!state.playing) return;
  if (!state.trace || state.i >= state.trace.steps.length - 1) { stop(); return; }
  go(state.i + 1);
  state.timer = setTimeout(tick, SPEEDS[$('#speed').value]);
}
function togglePlay() {
  if (!state.trace) return;
  if (state.playing) { stop(); return; }
  if (state.i >= state.trace.steps.length - 1) { state.i = 0; render(); }
  state.playing = true;
  updateControls();
  state.timer = setTimeout(tick, 500);
}
function loadPreset(k) {
  state.preset = k;
  $('#preset').value = String(k);
  const scratch = k === 'scratch';
  ta.value = scratch ? (state.scratch[state.ds] || '') : presets()[k][2];
  if (!scratch && presets()[k][3] && presets()[k][3].rules) {
    const r = rulesNow();
    Object.keys(r).forEach(key => delete r[key]);
    Object.entries(presets()[k][3].rules).forEach(([key, v]) => { r[key] = Object.assign({}, v); });
  }
  $('#restore').textContent = scratch ? 'Clear' : 'Restore';
  $('#restore').title = scratch ? 'Clear your query' : 'Undo your edits to this example';
  reset();
  if (scratch) ta.focus();
}
function loadDataset(d) {
  state.ds = d;
  setDataset(DATASETS[d]);
  document.documentElement.dataset.ds = DATASETS[d].id;
  $('#emblem').textContent = DATASETS[d].emoji || '';
  $('#art').innerHTML = ART[DATASETS[d].id] || '';
  $('#dataset').value = String(d);
  let h = '<option value="scratch">✎ Write your own query</option>', group = null;
  presets().forEach((p, i) => {
    if (p[0] !== group) { if (group !== null) h += '</optgroup>'; h += `<optgroup label="${esc(p[0])}">`; group = p[0]; }
    h += `<option value="${i}">${i + 1}. ${esc(p[1])}</option>`;
  });
  $('#preset').innerHTML = h + '</optgroup>';
  loadPreset(state.preset === 'scratch' ? 'scratch' : 0);
}
function insertAtCursor(txt) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const before = ta.value.slice(0, s);
  const pad = before && !/[\s(,.]$/.test(before) ? ' ' : '';
  ta.setRangeText(pad + txt, s, e, 'end');
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}

/* ---------------- wiring ---------------- */
$('#dataset').innerHTML = DATASETS.map((d, i) => `<option value="${i}">${esc(d.name)}</option>`).join('');
$('#dataset').addEventListener('change', e => loadDataset(+e.target.value));
$('#preset').addEventListener('change', e => loadPreset(e.target.value === 'scratch' ? 'scratch' : +e.target.value));
$('#restore').addEventListener('click', () => {
  if (state.preset === 'scratch') state.scratch[state.ds] = '';
  loadPreset(state.preset);
});
$('#right').addEventListener('click', e => {
  const b = e.target.closest('[data-ins]');
  if (b && !state.trace) insertAtCursor(b.dataset.ins);
});
$('#run').addEventListener('click', run);
$('#reset').addEventListener('click', reset);
$('#prev').addEventListener('click', () => { stop(); go(state.i - 1); });
$('#next').addEventListener('click', () => { stop(); go(state.i + 1); });
$('#play').addEventListener('click', togglePlay);
$('#fks').addEventListener('change', e => {
  const sel = e.target.closest('select[data-fk]');
  if (!sel) return;
  const r = rulesNow();
  r[sel.dataset.fk] = Object.assign({}, r[sel.dataset.fk], { [sel.dataset.kind]: sel.value });
  if (state.trace) run(); else renderFks();
});
$('#egg').addEventListener('click', e => { if (e.target.closest('.egg-x')) hideEgg(); });
$('#crumbs').addEventListener('click', e => {
  const d = e.target.closest('[data-step]');
  if (d) { stop(); go(+d.dataset.step); return; }
  const b = e.target.closest('.crumb');
  if (b) { stop(); go(+b.dataset.first); }
});
$('#rowbyrow').addEventListener('change', () => {
  if (!state.trace) return;
  const stage = state.trace.steps[state.i].crumb;
  run();
  if (state.trace && state.trace.crumbs[stage]) { state.i = state.trace.crumbs[stage].first; render(false); }
});
ta.addEventListener('input', () => {
  renderFks();
  if (state.preset === 'scratch') state.scratch[state.ds] = ta.value;
  if (state.trace || state.err) { stop(); state.trace = null; state.err = null; state.dirty = true; render(false); }
  else paintEditor();
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (e.key === 'Escape') { hideEgg(); $('#menu').open = false; ta.blur(); return; }
  if (document.activeElement === ta || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.target.closest && e.target.closest('summary')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); stop(); if (!state.trace) run(); else go(state.i + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); stop(); go(state.i - 1); }
  else if (e.key === 'Home') { stop(); go(0); }
  else if (e.key === 'End') { stop(); if (state.trace) go(state.trace.steps.length - 1); }
  else if (e.key.toLowerCase() === 'p') togglePlay();
});
let scale = 1.35;
const setScale = v => { scale = Math.max(.8, Math.min(1.8, v)); document.documentElement.style.setProperty('--scale', scale); paintEditor(); fitRegions(); };
$('#bigger').addEventListener('click', () => setScale(scale + .1));
$('#smaller').addEventListener('click', () => setScale(scale - .1));
$('#theme').addEventListener('click', () => {
  const r = document.documentElement;
  if (r.hasAttribute('data-fun')) r.removeAttribute('data-fun'); else r.setAttribute('data-fun', 'on');
  $('#theme').textContent = r.hasAttribute('data-fun') ? 'Plain' : 'Fun';
  requestAnimationFrame(fitRegions);
});
const setMode = m => {
  document.documentElement.dataset.mode = m;
  $('#mode').textContent = m === 'dark' ? '☀ Light' : '☾ Dark';
};
setMode(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#mode').addEventListener('click', () => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark'));
window.addEventListener('resize', () => { paintEditor(); fitRegions(); });

loadDataset(0);

document.addEventListener('click', e => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });

</script>
</body>
</html>
