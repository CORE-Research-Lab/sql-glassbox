<!DOCTYPE html>
<html lang="en" data-fun="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL, step by step · CSC343</title>
<style>
:root {
  --scale: 1.35;
  --paper: #f5f7fa;
  --panel: #ffffff;
  --ink: #17223a;
  --muted: #5d6679;
  --faint: #9aa3b4;
  --line: #2b3854;
  --line-soft: #c9d0dc;

  --from: #2c6bbf;    --from-bg: #e2edfb;
  --join: #4b45c9;    --join-bg: #e4e3fb;
  --del: #c62828;     --del-bg: #fde3e1;
  --upd: #b85c00;     --upd-bg: #fdebd6;
  --fk: #5b6ee1;      --fk-bg: #e5e9fc;
  --where: #b57b00;   --where-bg: #fff0bf;  --where-bg2: #ffd95e;
  --select: #1f7f4a;  --select-bg: #d9f2e2;
  --group: #7650c4;   --group-bg: #ebe3fa;
  --distinct: #b93d72; --distinct-bg: #fbe1ec;
  --order: #0f7c86;   --order-bg: #d5f0f2;
  --result: #33415e;  --result-bg: #e4e8f0;
  --active: #e8710a;
  --pass: #1f7f4a;    --fail: #c0392b;

  --g0: #fbe9b0; --g1: #d0e3f8; --g2: #f5d4e1; --g3: #d2eed7; --g4: #e2d7f7; --g5: #cdebec;

  --sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  --dur: 600ms;
  --tk-k: #a13a8f; --tk-f: #b3470f; --tk-s: #1f7f4a; --tk-n: #b3470f;
  --display: var(--sans); --bg: var(--paper);
}
:root[data-mode="dark"] {
  --paper: #121824; --panel: #1b2332; --ink: #e8edf5; --muted: #a4aec0; --faint: #6e7a90;
  --line: #7d8ba6; --line-soft: #3a465c;
  --from: #7fb0f0; --from-bg: #1f3350; --join: #a5a1f5; --join-bg: #2c2a55;
  --where: #f2c14e; --where-bg: #4a3b12; --where-bg2: #7a5f10;
  --select: #6fd39a; --select-bg: #173d29;
  --group: #b79cf0; --group-bg: #33284d;
  --distinct: #f08cb5; --distinct-bg: #4a2033;
  --order: #6fd0d8; --order-bg: #143d42;
  --result: #c3cce0; --result-bg: #2a3346;
  --del: #ff8a80; --del-bg: #4a1c1c; --upd: #ffb45e; --upd-bg: #4a2e10; --fk: #9fb0ff; --fk-bg: #262f5c;
  --active: #ff9a3d; --pass: #6fd39a; --fail: #ff7b6b;
  --g0: #4d4118; --g1: #1f3656; --g2: #4d2437; --g3: #1d4128; --g4: #372a56; --g5: #17403f;
  --tk-k: #e38ad3; --tk-f: #ffab6e; --tk-s: #7fdca6; --tk-n: #ffab6e;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { font-size: calc(16px * var(--scale)); height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--sans);
  transition: background-color .4s, color .4s;
  display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--from); outline-offset: 2px; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: .6rem; padding: .55rem 1.1rem;
  border-bottom: 1px solid var(--line-soft); background: var(--hdr, var(--panel)); color: var(--hdr-ink, var(--ink));
}
.brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
#emblem { margin-right: .35rem; }
.brand p { margin: 0; font-size: .7rem; color: var(--hdr-muted, var(--muted)); white-space: nowrap; }
.spacer { flex: 1; }
.presets { display: flex; align-items: center; gap: .5rem; }
.presets label, header .opts { font-size: .8rem; color: var(--hdr-muted, var(--muted)); }
.presets select { padding: .35rem .5rem; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel); color: var(--ink); font-size: .85rem; max-width: 13rem; }
.tool { white-space: nowrap; border: 1px solid var(--line-soft); background: var(--panel); color: var(--ink); border-radius: 6px; padding: .3rem .6rem; font-size: .8rem; cursor: pointer; }
.tool:hover { border-color: var(--line); }

/* ---------- breadcrumb ---------- */
#crumbs {
  display: flex; align-items: center; flex-wrap: wrap; gap: .35rem .22rem; min-width: 0; min-height: 2.6rem;
  margin-top: -.7rem; padding: .5rem .7rem; background: var(--panel);
  border: 2px solid var(--line-soft); border-top: 1px dashed var(--line-soft); border-radius: 0 0 10px 10px;
}
#centre .editor { border-radius: 10px 10px 0 0; border-bottom: 0; }
#centre .editor:focus-within + #crumbs { border-color: var(--from); }
.runrow .grow { flex: 1; }
header { min-width: 0; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + .4rem); z-index: 70; min-width: 16rem;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line-soft); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .18); padding: .7rem .8rem; display: flex; flex-direction: column; gap: .6rem; font-size: .85rem;
}
.menu-pop label, .menu-row { display: flex; align-items: center; gap: .45rem; white-space: nowrap; }
.menu-pop select { padding: .2rem .3rem; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel); color: var(--ink); }
.menu-pop input { width: 1rem; height: 1rem; accent-color: var(--from); }
.fks[hidden], #egg[hidden] { display: none; }
#crumbs .hint { color: var(--faint); font-size: .85rem; }
.btn.nav { font-size: 1rem; padding: .38rem .8rem; }
.dots { display: inline-flex; gap: .15rem; margin-left: .32rem; vertical-align: middle; }
.sd { width: .42rem; height: .42rem; border-radius: 50%; border: 1.5px solid currentColor; opacity: .7; cursor: pointer; }
.sd.done { background: currentColor; opacity: .5; }
.sd.on { background: currentColor; opacity: 1; transform: scale(1.35); }
.crumb.now .sd { border-color: var(--panel); }
.crumb.now .sd.on, .crumb.now .sd.done { background: var(--panel); }
.crumb {
  --c: var(--result); --cbg: var(--result-bg); display: inline-flex; align-items: center;
  border: 2px solid var(--c); color: var(--c); background: transparent; border-radius: 999px;
  padding: .1rem .42rem; font-weight: 700; font-size: .76rem; cursor: pointer; opacity: .55; white-space: nowrap;
  font-family: var(--mono); letter-spacing: .01em; transition: opacity .2s, background .2s;
}
.crumb.done { opacity: .9; background: var(--cbg); }
.crumb.now { opacity: 1; background: var(--c); color: var(--panel); box-shadow: 0 0 0 4px var(--cbg); }
.arrow { color: var(--faint); font-size: .75rem; }
.scope-lbl { font-size: .66rem; color: var(--muted); border: 1px dashed var(--faint); border-radius: 6px; padding: .1rem .45rem; margin-right: .1rem; }
.scope-sep { flex-basis: 100%; height: 0; }
.st-from { --c: var(--from); --cbg: var(--from-bg); }
.st-join { --c: var(--join); --cbg: var(--join-bg); }
.st-del { --c: var(--del); --cbg: var(--del-bg); }
.st-upd { --c: var(--upd); --cbg: var(--upd-bg); }
.st-fk { --c: var(--fk); --cbg: var(--fk-bg); }
.st-where { --c: var(--where); --cbg: var(--where-bg); }
.st-group { --c: var(--group); --cbg: var(--group-bg); }
.st-select { --c: var(--select); --cbg: var(--select-bg); }
.st-distinct { --c: var(--distinct); --cbg: var(--distinct-bg); }
.st-order { --c: var(--order); --cbg: var(--order-bg); }
.st-result { --c: var(--result); --cbg: var(--result-bg); }

/* ---------- main layout ---------- */
#stage {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(31rem, 1fr) minmax(0, 1.1fr);
  gap: 1rem; padding: .8rem 1.1rem; min-height: 0;
}
.region { min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: .2rem; }
.panels { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 1rem 1.25rem; }
#right .panels { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; }

/* ---------- centre ---------- */
#centre { display: flex; flex-direction: column; gap: .7rem; min-height: 0; overflow: auto; padding: .2rem; }
.runrow { display: flex; gap: .5rem; }
.editor {
  position: relative; border: 2px solid var(--line-soft); border-radius: 10px; background: var(--panel);
  font-family: var(--mono); font-size: 1.05rem; line-height: 1.55; flex: none;
}
.editor:focus-within { border-color: var(--from); }
.editor pre, .editor textarea {
  margin: 0; padding: .7rem .85rem; font: inherit; line-height: inherit; white-space: pre-wrap; overflow-wrap: break-word;
  word-break: normal; tab-size: 2; border: 0; width: 100%; letter-spacing: 0;
}
.editor pre { position: absolute; inset: 0; pointer-events: none; overflow: hidden; color: var(--ink); }
.editor textarea {
  position: relative; display: block; resize: none; background: transparent; color: transparent; caret-color: var(--ink);
  outline: none; overflow: hidden; min-height: 5rem;
}
.editor textarea::selection { background: rgba(44, 107, 191, .28); color: transparent; }
.tk-k { color: var(--tk-k); font-weight: 700; }
.tk-f { color: var(--tk-f); font-weight: 700; }
.tk-s { color: var(--tk-s); }
.tk-n { color: var(--tk-n); }
.tk-c { color: var(--faint); font-style: italic; }
.editor .dim { opacity: .32; }
.editor [class*="h-"] { border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.editor .h-from { background: var(--from-bg); box-shadow: inset 0 -3px 0 var(--from); }
.editor .h-del { background: var(--del-bg); box-shadow: inset 0 -3px 0 var(--del); }
.editor .h-upd { background: var(--upd-bg); box-shadow: inset 0 -3px 0 var(--upd); }
.editor .h-join { background: var(--join-bg); box-shadow: inset 0 -3px 0 var(--join); }
.editor .h-where { background: var(--where-bg); box-shadow: inset 0 -3px 0 var(--where); }
.editor .h-group { background: var(--group-bg); box-shadow: inset 0 -3px 0 var(--group); }
.editor .h-select { background: var(--select-bg); box-shadow: inset 0 -3px 0 var(--select); }
.editor .h-distinct { background: var(--distinct-bg); box-shadow: inset 0 -3px 0 var(--distinct); }
.editor .h-order { background: var(--order-bg); box-shadow: inset 0 -3px 0 var(--order); }
.editor .h2 { background: color-mix(in srgb, var(--hc, var(--select)) 30%, var(--panel)); box-shadow: inset 0 -4px 0 var(--hc, var(--select)); border-radius: 0; }
.editor .err { text-decoration: wavy underline var(--fail) 2px; text-underline-offset: 4px; background: rgba(192, 57, 43, .12); }

.controls { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
.btn {
  border: 2px solid var(--line-soft); background: var(--panel); border-radius: 8px; padding: .38rem .8rem;
  font-weight: 600; font-size: .95rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.playing { background: var(--active); color: #fff; border-color: var(--active); }
.opts { display: flex; gap: .6rem; align-items: center; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.opts select { padding: .2rem .3rem; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel); }
.opts label { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; }
.opts input { width: 1.05rem; height: 1.05rem; accent-color: var(--from); }

.caption {
  position: relative; margin-top: .9rem; padding: 1.3rem 2.6rem; min-height: 5.6rem;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.caption > * { position: relative; }
.caption .cloud { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.caption .cloud path { fill: var(--panel); stroke: var(--c, var(--line-soft)); stroke-width: 2.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.caption .puff { position: absolute; border-radius: 50%; background: var(--panel); border: 2.5px solid var(--c, var(--line-soft)); }
.caption .puff.p1 { width: .85rem; height: .85rem; left: 3.2rem; top: -.35rem; }
.caption .puff.p2 { width: .5rem; height: .5rem; left: 2.3rem; top: -1.05rem; }
.caption.empty { visibility: hidden; }
.caption .cap { font-family: var(--display); font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.caption .test { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; }
.caption .test.ok { color: var(--pass); } .caption .test.bad { color: var(--fail); }
.vchip { display: inline-block; background: var(--from); color: var(--panel); border-radius: 6px; padding: 0 .4rem; font-weight: 700; }

.error {
  border: 2px solid var(--fail); background: color-mix(in srgb, var(--fail) 9%, var(--panel)); border-radius: 10px;
  padding: .6rem .8rem; font-size: 1.02rem; line-height: 1.35;
}
.error .ecl { font-family: var(--mono); font-weight: 700; color: var(--fail); margin-right: .4rem; }

/* ---------- tables ---------- */
.panel { position: relative; }
.ptitle { font-family: var(--display); display: flex; align-items: center; gap: .45rem; margin-bottom: .3rem; font-weight: 700; font-size: 1.05rem; flex-wrap: wrap; }
.tname { padding: 0 .25rem; border-radius: 4px; }
.tname.from { background: var(--from-bg); box-shadow: inset 0 -3px 0 var(--from); }
.badge { font-family: var(--mono); background: var(--active); color: #fff; border-radius: 6px; padding: 0 .45rem; font-size: .95rem; }
.tag { font-size: .72rem; font-weight: 600; color: var(--muted); border: 1px dashed var(--faint); border-radius: 999px; padding: .05rem .5rem; }
.note { font-weight: 500; font-size: .85rem; color: var(--muted); }
.panel.group .ptitle .gl { background: var(--gc); padding: .05rem .5rem; border-radius: 6px; font-family: var(--mono); font-size: .95rem; }

.tbl { display: grid; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.tbl.w6 { font-size: .98rem; } .tbl.w8 { font-size: .86rem; }
.tbl.w6 .th, .tbl.w6 .td { padding: .28rem .5rem; }
.tbl.tall { font-size: .8rem; }
.th, .td { padding: .3rem .7rem; border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); white-space: nowrap; background: var(--panel); }
.th { font-weight: 700; background: var(--result-bg); border-top: 1.5px solid var(--line); font-size: .92em; }
.th .q { display: block; font-family: var(--mono); font-size: .72em; font-weight: 700; color: var(--active); line-height: 1.1; }
.th.first, .td.first { border-left: 1.5px solid var(--line); }
.td.num { text-align: right; }
.td.mk, .th.mk { border: 0; background: transparent; padding: .3rem .4rem; font-weight: 800; }
.mk.yes { color: var(--pass); } .mk.no { color: var(--fail); } .mk.dup { color: var(--distinct); font-size: .8em; }
.mk.ptr { color: var(--active); font-family: var(--mono); }
.mk.nomatch { color: var(--active); font-size: .8em; }
.td.null { color: var(--faint); font-style: italic; font-size: .85em; }
.td.padded:not(.mk), .td.nomatch:not(.mk) { background: color-mix(in srgb, var(--active) 14%, var(--panel)); }
.td.padded.null { background: color-mix(in srgb, var(--active) 26%, var(--panel)); color: var(--active); font-weight: 700; }
.panel.schema { font-family: var(--mono); font-size: .9rem; line-height: 1.7; border-left: 4px solid var(--line-soft); padding-left: .7rem; }
.ins { border: 0; background: none; padding: 0 .1rem; font: inherit; color: inherit; cursor: pointer; border-radius: 4px; }
.ins:hover { background: var(--from-bg); color: var(--from); }
.tbl-ins { font-weight: 700; }
.schema-tip { font-family: var(--sans); font-size: .75rem; color: var(--faint); margin-top: .3rem; }
.editor textarea::placeholder { color: var(--faint); opacity: 1; }
.td.emptyrow { grid-column: 1 / -1; color: var(--faint); font-style: italic; text-align: center; border-left: 1.5px solid var(--line); }
.panel.temp .th, .panel.temp .td:not(.mk) { border-style: dashed; }
.panel.final .th { background: var(--ink); color: var(--panel); }

/* column states */
.th.chk { background: var(--where-bg2); } .td.chk { background: var(--where-bg); }
.td.chk2 { background: var(--where-bg2); font-weight: 800; }
.th.sel { background: var(--select); color: var(--panel); } .td.sel { background: var(--select-bg); }
.th.drop, .td.drop {
  color: var(--faint);
  background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--faint) 22%, transparent) 6px 8px);
}
.th.grp { background: var(--group); color: var(--panel); } .td.grp { font-weight: 700; }
.th.agg { background: var(--select); color: var(--panel); } .td.agg { box-shadow: inset 0 0 0 3px var(--select); font-weight: 700; }
.th.sort { background: var(--order); color: var(--panel); } .td.sort { background: var(--order-bg); font-weight: 700; }
.th.ghost, .td.ghost { border-style: dashed; color: var(--order); font-style: italic; background: transparent; }

/* row states */
.td.g0 { background: var(--g0); } .td.g1 { background: var(--g1); } .td.g2 { background: var(--g2); }
.td.g3 { background: var(--g3); } .td.g4 { background: var(--g4); } .td.g5 { background: var(--g5); }
.td.pass:not(.mk) { background: color-mix(in srgb, var(--pass) 16%, var(--panel)); }
.td.pass.chk2 { background: color-mix(in srgb, var(--pass) 30%, var(--panel)); }
.td.fail:not(.mk) { opacity: .35; }
.td.fail.mk { opacity: 1; }
.td.pending:not(.mk) { opacity: .45; }
.td.active:not(.mk) { box-shadow: inset 0 3px 0 var(--active), inset 0 -3px 0 var(--active); }
.td.active.first { box-shadow: inset 0 3px 0 var(--active), inset 0 -3px 0 var(--active), inset 3px 0 0 var(--active); }
.td.active.lastc { box-shadow: inset 0 3px 0 var(--active), inset 0 -3px 0 var(--active), inset -3px 0 0 var(--active); }
.td.aggrow:not(.mk) { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--select) 55%, transparent); }
.panel.group { padding-left: .6rem; border-left: 8px solid var(--gc); }
.gc0 { --gc: var(--g0); } .gc1 { --gc: var(--g1); } .gc2 { --gc: var(--g2); } .gc3 { --gc: var(--g3); } .gc4 { --gc: var(--g4); } .gc5 { --gc: var(--g5); }

/* ---------- combination grid ---------- */
.xgrid { display: grid; gap: 4px; align-items: center; font-size: .82rem; }
.xgrid .cl { text-align: center; color: var(--muted); font-weight: 600; padding: 0 .15rem; white-space: nowrap; line-height: 1.15; align-self: end; }
.xgrid .rl { text-align: right; color: var(--muted); font-weight: 600; padding-right: .4rem; white-space: nowrap; }
.xgrid .rl.on { color: var(--active); }
.xgrid .corner { font-family: var(--mono); font-size: .75rem; color: var(--faint); text-align: right; padding-right: .4rem; }
.dot { width: 1.55rem; height: 1.55rem; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
.dot.n { border: 2px solid var(--line-soft); }
.dot.p { background: var(--pass); color: var(--panel); }
.dot.f { background: var(--line-soft); color: var(--faint); transform: scale(.7); }
.dot.on { outline: 3px solid var(--active); outline-offset: 1px; }

/* ---------- aggregate boxes ---------- */
.panel.agg { border: 2px solid var(--select); border-radius: 10px; padding: .5rem .7rem; background: var(--panel); min-width: 14rem; max-width: 100%; }
.panel.agg.gcol { border-left: 10px solid var(--gc); }
.agg .fn { font-family: var(--mono); color: var(--select); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font-size: 1.05rem; font-variant-numeric: tabular-nums; border: 2px solid var(--select); background: var(--select-bg); border-radius: 6px; padding: .05rem .45rem; font-weight: 700; }
.chip.dup { opacity: .35; text-decoration: line-through; border-style: dashed; }
.chip.null { opacity: .4; font-style: italic; }
.chip.gone { animation: fold .45s ease-out forwards; animation-delay: calc(var(--i) * 40ms); }
.chip.winner { border-color: var(--active); box-shadow: 0 0 0 3px var(--active); }
.agg-res { display: flex; align-items: baseline; gap: .6rem; margin-top: .4rem; flex-wrap: wrap; }
.formula { font-family: var(--mono); color: var(--muted); font-size: .95rem; }
.res { font-size: 1.9rem; font-weight: 800; color: var(--select); animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: .35s; }
@keyframes fold { to { opacity: .28; transform: scale(.85); } }

/* ---------- motion ---------- */
#fly { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.enter { animation: enter .3s ease-out both; }
.just-fail:not(.mk) { animation: dimout .5s ease-out both; }

@keyframes enter { from { opacity: 0; } to { opacity: 1; } }

/* ---------- easter eggs ---------- */

<body>
<header>
  <div class="brand">
    <h1><span id="emblem" aria-hidden="true"></span>SQL, step by step</h1>
  </div>
  <div class="spacer"></div>

    <label for="dataset">Dataset</label>

    <label for="preset">Example</label>

  </div>

      <label title="Surprise dialogue when certain results appear"><input type="checkbox" id="eggs" checked> Easter eggs</label>

      <div class="menu-row">Text size <button class="tool" id="smaller" title="Smaller text">A−</button><button class="tool" id="bigger" title="Bigger text">A+</button></div>

    </div>

</header>

      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="sql" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="SQL query" placeholder="SELECT …&#10;FROM …&#10;WHERE …;"></textarea>
    </div>

    <div class="runrow">
      <button class="btn primary" id="run" title="Run (Ctrl+Enter)">Run</button>
      <button class="btn" id="reset" title="Back to the data">Reset</button>

      <button class="btn nav" id="next" title="Next step (→, Space or PageDown)" aria-label="Next step">▶</button>

<script>
/* =====================================================================

const DATASETS = [

    fks: [{ child: 'Takes', col: 'sid', parent: 'Students', pcol: 'sid' }, { child: 'Takes', col: 'course', parent: 'Courses', pcol: 'course' }],
    tables: {
      Students: {

/* =====================================================================
   ENGINE: lecture data, lexer, parser, evaluator, and trace builder.
   The trace is a list of full "snapshots" (steps). The UI only renders
   snapshots; it never evaluates SQL itself.
   ===================================================================== */

let DB = null, FKS = [];
function setDataset(ds) { DB = ds.tables; FKS = ds.fks || []; }

class SqlError extends Error {
  constructor(msg, clause, s, e) { super(msg); this.clause = clause || null; this.s = s; this.e = e; }
}

/* ---------------- Lexer ---------------- */
const KW = new Set(['SELECT', 'DISTINCT', 'ALL', 'FROM', 'WHERE', 'GROUP', 'BY', 'ORDER', 'ASC', 'DESC',
  'AND', 'OR', 'NOT', 'AS', 'HAVING', 'NULL', 'IS', 'IN', 'LIKE', 'JOIN', 'INNER', 'LEFT', 'RIGHT',
  'OUTER', 'ON', 'LIMIT', 'UNION', 'INTERSECT', 'EXCEPT', 'BETWEEN', 'EXISTS', 'CROSS', 'NATURAL',
  'OFFSET', 'CASE', 'WITH', 'TRUE', 'FALSE', 'FULL', 'USING', 'DELETE', 'UPDATE', 'SET', 'INSERT', 'INTO', 'VALUES']);
const AGG = new Set(['COUNT', 'AVG', 'SUM', 'MIN', 'MAX']);

function tokenize(src, lenient) {
  const toks = [];
  let i = 0;
  const bad = (msg, s, e) => {
    if (lenient) { toks.push({ t: 'bad', s, e }); i = e; return; }
    throw new SqlError(msg, null, s, e);
  };
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    const s = i;
    if (c === '-' && src[i + 1] === '-') {
      while (i < src.length && src[i] !== '\n') i++;
      if (lenient) toks.push({ t: 'comment', s, e: i });
      continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      while (i < src.length && /[A-Za-z0-9_]/.test(src[i])) i++;
      const v = src.slice(s, i), up = v.toUpperCase();
      toks.push({ t: KW.has(up) ? 'kw' : 'id', v, up, s, e: i });
      continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      while (i < src.length && /[0-9]/.test(src[i])) i++;
      if (src[i] === '.' && /[0-9]/.test(src[i + 1] || '')) { i++; while (i < src.length && /[0-9]/.test(src[i])) i++; }
      toks.push({ t: 'num', v: parseFloat(src.slice(s, i)), s, e: i });
      continue;
    }
    if (c === "'") {
      i++;
      let v = '', closed = false;
      while (i < src.length) {
        if (src[i] === "'") { if (src[i + 1] === "'") { v += "'"; i += 2; continue; } i++; closed = true; break; }
        v += src[i++];
      }
      if (!closed) { bad("This text value is missing its closing quote '", s, src.length); continue; }
      toks.push({ t: 'str', v, s, e: i });
      continue;
    }
    if (c === '"') {
      let j = i + 1; while (j < src.length && src[j] !== '"') j++;
      const inner = src.slice(i + 1, j);
      bad(`Text values use single quotes: '${inner}'. (Double quotes are for names, not values.)`, s, Math.min(j + 1, src.length));
      continue;
    }
    const two = src.slice(i, i + 2);
    if (['<=', '>=', '<>', '!='].includes(two)) { toks.push({ t: 'op', v: two === '!=' ? '<>' : two, s, e: i + 2 }); i += 2; continue; }
    if ('=<>+-*/'.includes(c)) { toks.push({ t: 'op', v: c, s, e: i + 1 }); i++; continue; }
    if ('(),.;'.includes(c)) { toks.push({ t: 'p', v: c, s, e: i + 1 }); i++; continue; }
    bad(`Unexpected character "${c}"`, s, s + 1);
  }
  toks.push({ t: 'eof', s: src.length, e: src.length });
  return toks;
}

/* ---------------- Parser ---------------- */
function parse(src) {
  const toks = tokenize(src, false);
  let p = 0, clause = 'SELECT', depth = 0;
  const peek = (k = 0) => toks[Math.min(p + k, toks.length - 1)];
  const isKw = (w, k = 0) => { const t = peek(k); return t.t === 'kw' && t.up === w; };
  const isP = (v, k = 0) => { const t = peek(k); return t.t === 'p' && t.v === v; };
  const isOp = (v, k = 0) => { const t = peek(k); return t.t === 'op' && t.v === v; };
  const next = () => toks[p++];
  const desc = t => (t.t === 'eof' ? 'the end of the query' : `"${src.slice(t.s, t.e)}"`);
  const err = (msg, t = peek()) => { throw new SqlError(msg, clause, t.s, t.e); };
  const expectKw = w => { if (!isKw(w)) err(`Expected ${w} but found ${desc(peek())}`); return next(); };
  const expectP = v => { if (!isP(v)) err(`Expected "${v}" but found ${desc(peek())}`); return next(); };
  const last = () => toks[p - 1];

  if (toks.length === 1) throw new SqlError('Type a query first (start with SELECT).', null, 0, 0);

  function parseQuery() {
    const q = { depth, spans: {}, items: [], selectItems: [], star: false, distinct: false, where: null, groupBy: [], orderBy: [] };
    clause = 'SELECT';
    if (!isKw('SELECT')) err(depth ? 'A subquery must start with SELECT' : 'A statement must start with SELECT, UPDATE or DELETE');
    const selTok = next();
    q.s = selTok.s;
    if (isKw('DISTINCT')) { const d = next(); q.distinct = true; q.spans.distinct = [d.s, d.e]; } else if (isKw('ALL')) next();
    if (isOp('*')) { const t = next(); q.star = true; q.starSpan = [t.s, t.e]; }
    else {
      for (;;) {
        if (isKw('FROM')) err('The SELECT list is empty or ends with a comma');
        const ex = parseExpr();
        let alias = null;
        if (isKw('AS')) { next(); if (peek().t !== 'id') err('Expected a name after AS'); alias = next().v; }
        else if (peek().t === 'id') alias = next().v;
        q.selectItems.push({ expr: ex, alias });
        if (isP(',')) { next(); continue; }
        break;
      }
    }
    q.spans.select = [selTok.s, last().e];
    clause = 'FROM';
    if (!isKw('FROM')) err(peek().t === 'eof' ? 'The query needs a FROM clause' : `Expected FROM but found ${desc(peek())}`);
    const fromTok = next();
    q.items.push(parseFromItem());
    for (;;) {
      if (isP(',')) { const c = next(); const it = parseFromItem(); it.join = { kind: 'COMMA', label: ',', s: c.s, span: [c.s, it.e] }; q.items.push(it); continue; }
      const jk = parseJoinKw();
      if (!jk) break;
      const it = parseFromItem();
      it.join = jk;
      if (jk.kind === 'CROSS') jk.span = [jk.s, it.e];
      else {
        if (isKw('USING')) err('JOIN … USING is not supported here. Write ON with the matching columns, e.g. ON a.sid = b.sid');
        if (!isKw('ON')) err(`${jk.label} needs a condition: ${jk.label} ${it.alias || it.table} ON …`);
        next();
        clause = 'ON';
        if (peek().t === 'eof' || isKw('WHERE') || isKw('JOIN')) err('ON needs a condition');
        jk.on = parseExpr();
        jk.onSpan = [jk.on.s, jk.on.e];
        jk.span = [jk.s, last().e];
        clause = 'FROM';
      }
      q.items.push(it);
    }
    if (isKw('ON')) err('ON must come right after JOIN table-name');
    q.spans.from = [fromTok.s, last().e];
    if (isKw('WHERE')) {
      clause = 'WHERE';
      const w = next();
      if (isKw('GROUP') || isKw('ORDER') || peek().t === 'eof' || isP(')') || isP(';')) err('WHERE needs a condition');
      q.where = parseExpr();
      q.spans.where = [w.s, last().e];
    }
    if (isKw('GROUP')) {
      clause = 'GROUP BY';
      const g = next(); expectKw('BY');
      for (;;) { q.groupBy.push(parseExpr()); if (isP(',')) { next(); continue; } break; }
      q.spans.group = [g.s, last().e];
    }
    if (isKw('HAVING')) { clause = 'HAVING'; err('HAVING is not supported in this tool yet (it comes in a later lecture).'); }
    if (isKw('ORDER')) {
      clause = 'ORDER BY';
      const o = next(); expectKw('BY');
      for (;;) {
        const ex = parseExpr();
        let dir = 'ASC';
        if (isKw('ASC')) next(); else if (isKw('DESC')) { next(); dir = 'DESC'; }
        q.orderBy.push({ expr: ex, dir });
        if (isP(',')) { next(); continue; }
        break;
      }
      q.spans.order = [o.s, last().e];
    }
    for (const w of ['LIMIT', 'OFFSET', 'UNION', 'INTERSECT', 'EXCEPT'])
      if (isKw(w)) err(`${w} is not supported in this tool.`);
    q.e = last().e;
    return q;
  }

  function parseSub() {
    const savedClause = clause;
    depth++;
    const q = parseQuery();
    depth--;
    clause = savedClause;
    return q;
  }

  function parseJoinKw() {
    const t = peek();
    let kind = null;
    if (isKw('NATURAL')) err('NATURAL JOIN is not supported here. Write JOIN … ON with the matching columns.');
    if (isKw('JOIN')) kind = 'INNER';
    else if (isKw('INNER')) { next(); kind = 'INNER'; }
    else if (isKw('LEFT') || isKw('RIGHT') || isKw('FULL')) { kind = next().up; if (isKw('OUTER')) next(); }
    else if (isKw('CROSS')) { next(); kind = 'CROSS'; }
    else return null;
    if (!isKw('JOIN')) err(`Expected JOIN after ${kind}`);
    next();
    return { kind, label: kind === 'INNER' ? 'JOIN' : `${kind} JOIN`, s: t.s };
  }

  function parseFromItem() {
    const t = peek();
    if (isP('(')) {
      const open = next();
      if (!isKw('SELECT')) err('Expected a subquery (SELECT …) inside the parentheses');
      const sub = parseSub();
      const close = expectP(')');
      if (isKw('AS')) next();
      if (peek().t !== 'id') err('A subquery in FROM needs a name (a tuple variable), e.g. ( … ) CSStudents');
      const a = next();
      return { sub, alias: a.v, s: open.s, e: a.e, subSpan: [open.s, close.e], aliasSpan: [a.s, a.e] };
    }
    if (t.t !== 'id') err(`Expected a table name but found ${desc(t)}`);
    next();
    let aliasTok = null;
    if (isKw('AS')) { next(); if (peek().t !== 'id') err('Expected a tuple-variable name after AS'); aliasTok = next(); }
    else if (peek().t === 'id') aliasTok = next();
    return { table: t.v, alias: aliasTok ? aliasTok.v : null, s: t.s, e: (aliasTok || t).e, nameSpan: [t.s, t.e], aliasSpan: aliasTok ? [aliasTok.s, aliasTok.e] : null };
  }

  const parseExpr = () => parseOr();
  function parseOr() {
    let l = parseAnd();
    while (isKw('OR')) { next(); const r = parseAnd(); l = { type: 'bin', op: 'OR', l, r, s: l.s, e: r.e }; }
    return l;
  }
  function parseAnd() {
    let l = parseNot();
    while (isKw('AND')) { next(); const r = parseNot(); l = { type: 'bin', op: 'AND', l, r, s: l.s, e: r.e }; }
    return l;
  }
  function parseNot() {
    if (isKw('NOT')) { const t = next(); const x = parseNot(); return { type: 'not', x, s: t.s, e: x.e }; }
    return parseCmp();
  }
  function parseCmp() {
    const l = parseAdd();
    const t = peek();
    if (t.t === 'op' && ['=', '<', '>', '<=', '>=', '<>'].includes(t.v)) {
      next();
      if (isKw('ALL') || isKw('ANY')) err(`${peek().up} is not supported in this tool yet.`);
      const r = parseAdd();
      return { type: 'bin', op: t.v, l, r, s: l.s, e: r.e };

  subs.forEach((sn, si) => {
    const label = subs.length > 1 ? `inner ${si + 1}` : 'inner';
    const innerCtx = { T: ctx.T, scopeId: `sub@${sn.s}`, scopeLabel: label, kind: 'scalar', extraLeft: [], scopeSpan: [sn.s, sn.e], parentScope: scope };
    const res = traceQuery(sn.q, innerCtx);
    const cl = clauseAt(q, sn.s);
    if (res.cols.length !== 1) throw new SqlError(`A subquery used as a value must return one column; this one returns ${res.cols.length}.`, cl, sn.s, sn.e);
    if (res.rows.length > 1) throw new SqlError(`This subquery returns ${res.rows.length} rows, but a subquery used as a value must return exactly one.`, cl, sn.s, sn.e);
    sn.value = res.rows.length ? res.rows[0].vals[0] : null;
    sn.valueKey = res.rows.length ? ck(res, res.rows[0], 0) : null;
    valuePanels.push({ kind: 'value', title: subs.length > 1 ? `subquery ${si + 1}` : 'subquery', v: fmt(sn.value, res.fmts && res.fmts[0]), k: `sv|${sn.s}`, f: sn.valueKey });
  });

  /* ---- 3. bind everything ---- */
  q.selectItems.forEach(s => bind(s.expr, 'SELECT', true));
  if (q.where) bind(q.where, 'WHERE', false);
  joins.forEach((j, k) => {
    if (!j.on) return;
    bind(j.on, 'ON', false);
    const lim = items[k + 1].offset + items[k + 1].cols.length;
    walk(j.on, x => {
      if (x.type === 'col' && x.idx >= lim)
        throw E('ON', `"${text(src, x)}" belongs to a table that is joined later. This ON can only use ${items.slice(0, k + 2).map(i => i.alias).join(' and ')}.`, x);
    });
  });
  q.groupBy.forEach(g => {
    if (g.type !== 'col') throw E('GROUP BY', 'GROUP BY takes column names in this tool', g);
    bind(g, 'GROUP BY', false);
  });
  const isAgg = q.groupBy.length > 0 || q.selectItems.some(s => hasAgg(s.expr)) || q.orderBy.some(o => hasAgg(o.expr));
  if (isAgg && q.star) throw new SqlError('SELECT * cannot be combined with aggregation or GROUP BY. Name the columns and aggregates you want.', 'SELECT', q.starSpan[0], q.starSpan[1]);
  const groupIdx = new Set(q.groupBy.map(g => g.idx));
  const checkGrouped = (n, clause) => {
    (function rec(x) {
      if (!x || x === '*') return;
      if (x.type === 'agg') return;
      if (x.type === 'col' && !groupIdx.has(x.idx)) {
        if (!q.groupBy.length) throw E(clause, `"${text(src, x)}" can't sit next to an aggregate without GROUP BY: the aggregate collapses all rows into one, so which ${x.name} would it show?`, x);
        throw E(clause, `"${text(src, x)}" must appear in GROUP BY or be inside an aggregate like COUNT(…).`, x);
      }
      if (x.type === 'bin') { rec(x.l); rec(x.r); } else if (x.type === 'not' || x.type === 'neg' || x.type === 'isnull') rec(x.x);
    })(n);
  };
  if (isAgg) q.selectItems.forEach(s => checkGrouped(s.expr, 'SELECT'));

  /* ---- output columns ---- */
  let outCols;
  if (q.star) outCols = items.flatMap(it => it.cols.map(c => ({ name: c, label: multi ? `${it.alias}.${c}` : c, q: it.alias })));
  else outCols = q.selectItems.map(s => ({ name: s.alias || text(src, s.expr), label: s.alias || text(src, s.expr) }));
  const outFmts = q.star ? null : q.selectItems.map(s => (s.expr.type === 'agg' && s.expr.fn === 'AVG' ? 'avg' : null));

  /* ---- ORDER BY binding ---- */
  const orderKeys = q.orderBy.map(o => {
    const n = o.expr;
    if (n.type === 'lit' && typeof n.v === 'number') {
      if (!Number.isInteger(n.v) || n.v < 1 || n.v > outCols.length) throw E('ORDER BY', `ORDER BY ${n.v}: there are only ${outCols.length} output column(s)`, n);
      return { out: n.v - 1, dir: o.dir, n };
    }
    if (n.type === 'col' && !n.q) {
      const j = outCols.findIndex(c => c.label.toLowerCase() === n.name.toLowerCase());
      if (j >= 0) return { out: j, dir: o.dir, n };
    }
    const t = text(src, n).toLowerCase();
    const j = outCols.findIndex(c => c.label.toLowerCase() === t);
    if (j >= 0) return { out: j, dir: o.dir, n };
    bind(n, 'ORDER BY', isAgg);
    if (isAgg) checkGrouped(n, 'ORDER BY');
    if (q.distinct) throw E('ORDER BY', `With SELECT DISTINCT, ORDER BY must use columns that are in the SELECT list ("${text(src, n)}" is not).`, n);
    return { expr: n, dir: o.dir, n };
  });

  /* ---- the rest of the trace uses this: ---- */
  ctx.extraLeft = ctx.extraLeft.concat(valuePanels);
  const S = q.spans;
  const selHl = [S.select];
  const sourceSpecs = (o = {}) => items.map(it => tableSpec(it.rel, Object.assign({ cls: it.rel.tag ? 'temp' : '' }, o[it.alias] || {})));

  /* ===== FROM ===== */
  CUR.clause = 'FROM';
  let R0;

  /* grid labels: one short label per source relation in a row */
  function labeler(rel) {
    const aliases = [...new Set(rel.cols.map(c => c.q))];
    const isText = j => rel.rows.some(r => typeof r.vals[j] === 'string');
    const used = new Set();
    const picks = aliases.map(a => {
      const idx = rel.cols.map((c, j) => j).filter(j => rel.cols[j].q === a);
      const named = idx.find(j => rel.cols[j].name.toLowerCase() === 'name');
      if (named !== undefined) { used.add('name'); return [named]; }
      if (aliases.length === 1 && idx.length <= 2) return idx;
      const txt = idx.find(j => isText(j) && !used.has(rel.cols[j].name.toLowerCase()));
      const pick = txt !== undefined ? txt : idx.find(j => !used.has(rel.cols[j].name.toLowerCase()));
      const j = pick !== undefined ? pick : idx[0];
      used.add(rel.cols[j].name.toLowerCase());
      return [j];
    });
    return r => picks.map(p => p.map(j => fmt(r.vals[j])).join(' · ')).join(' · ');
  }
  function rowLabel(rel, r) { return labeler(rel)(r); }
  function gridOf(L, Ltitle, Rr, Rtitle, stateFn, activeRow, note, id) {
    const la = labeler(L), lb = labeler(Rr);
    return {
      kind: 'grid', id, note, aTitle: Ltitle, bTitle: Rtitle,
      rowLabels: L.rows.map(la), colLabels: Rr.rows.map(lb),
      cells: L.rows.map((ra, i) => Rr.rows.map((rb, j) => stateFn(i, j))),
      active: activeRow,
    };
  }
  function gridSpec(A, B, stateFn, activeRow, note) { return gridOf(A.rel, A.alias, B.rel, B.alias, stateFn, activeRow, note, R0.rid); }

  if (items.length === 1) {
    R0 = items[0].rel;
    push(ctx, 'FROM', {
      hl: [S.from], left: [tableSpec(R0, { titleHl: 'from', cls: R0.tag ? 'temp' : '' })], right: [placeholder()],
      caption: null,
      leftLabel: 'FROM', rightLabel: '',
    });
  } else if (two) {
    const [A, B] = items;
    const rows = [];
    A.rel.rows.forEach(ra => B.rel.rows.forEach(rb => {
      rows.push({
        key: `${ra.key}+${rb.key}`, vals: ra.vals.concat(rb.vals),
        src: ra.vals.map((_, j) => ck(A.rel, ra, j)).concat(rb.vals.map((_, j) => ck(B.rel, rb, j))),
      });
    }));
    R0 = { rid: newRid('P'), title: `${A.alias} × ${B.alias}`, cols: items.flatMap(it => it.cols.map(c => ({ name: c, q: it.alias }))), rows, hidden: !!q.where };
    const la = A.rel.rows.length, lb = B.rel.rows.length;
    push(ctx, 'FROM', {
      hl: [S.from], left: sourceSpecs(Object.fromEntries(items.map(it => [it.alias, { titleHl: 'from' }]))), right: [placeholder('?')],
      caption: 'How many combinations?', leftLabel: 'FROM', rightLabel: '',
    });
    push(ctx, 'FROM', {
      hl: [S.from], left: sourceSpecs(Object.fromEntries(items.map(it => [it.alias, { titleHl: 'from' }]))),
      right: [gridSpec(A, B, () => 'n', -1, `${la} × ${lb} = ${la * lb} combinations`)],
      caption: `${la} × ${lb} = ${la * lb} combinations`, leftLabel: 'FROM', rightLabel: 'every combination',
    });
  } else {
    /* explicit JOIN chain: ((A JOIN B) JOIN C), one join at a time */
    push(ctx, 'FROM', {
      hl: [S.from], left: sourceSpecs(Object.fromEntries(items.map(it => [it.alias, { titleHl: 'from' }]))), right: [placeholder()],
      caption: null,
      leftLabel: 'FROM', rightLabel: '',
    });
    let L = items[0].rel, Lqual = false, Ltitle = items[0].alias;
    for (let k = 1; k < items.length; k++) {
      L = traceJoin(L, Lqual, Ltitle, items[k], joins[k - 1], k);
      Lqual = true;
      Ltitle = L.title;
    }
    R0 = L;
  }

  function traceJoin(L, Lqual, Ltitle, Rit, j, k) {
    CUR.clause = 'ON';
    const Rr = Rit.rel;
    const on = j.on;
    const outerL = j.kind === 'LEFT' || j.kind === 'FULL';
    const outerR = j.kind === 'RIGHT' || j.kind === 'FULL';
    const Lw = L.cols.length;
    const pass = L.rows.map(lr => Rr.rows.map(rr => (on ? evalE(on, lr.vals.concat(rr.vals), null) === true : true)));
    const lsrc = lr => lr.vals.map((_, c) => ck(L, lr, c));
    const rsrc = rr => rr.vals.map((_, c) => ck(Rr, rr, c));
    const nulls = n => new Array(n).fill(null);
    const matchedRow = (lr, rr) => ({ key: `${lr.key}+${rr.key}`, vals: lr.vals.concat(rr.vals), src: lsrc(lr).concat(rsrc(rr)) });
    const JOIN_SYM = { INNER: '⋈', LEFT: '⟕', RIGHT: '⟖', FULL: '⟗', CROSS: '×' };
    const title = `${Ltitle} ${JOIN_SYM[j.kind]} ${Rit.alias}`;
    const JR = { rid: newRid('J'), title, tag: null, cols: L.cols.concat(Rr.cols), rows: [] };
    const matchedOnly = [];
    const lHit = L.rows.map((_, i) => pass[i].some(Boolean));
    const rHit = Rr.rows.map((_, jj) => L.rows.some((__, i) => pass[i][jj]));
    L.rows.forEach((lr, i) => {
      Rr.rows.forEach((rr, jj) => { if (pass[i][jj]) { const m = matchedRow(lr, rr); JR.rows.push(m); matchedOnly.push(m); } });
      if (outerL && !lHit[i]) JR.rows.push({ key: `${lr.key}+∅`, vals: lr.vals.concat(nulls(Rr.cols.length)), src: lsrc(lr).concat(nulls(Rr.cols.length)), padded: true });
    });
    if (outerR) Rr.rows.forEach((rr, jj) => {
      if (!rHit[jj]) JR.rows.push({ key: `∅+${rr.key}`, vals: nulls(Lw).concat(rr.vals), src: nulls(Lw).concat(rsrc(rr)), padded: true });
    });
    const refs = on ? refCols(on) : new Set();
    const lCls = L.cols.map((c, jj) => (refs.has(jj) ? 'chk' : ''));
    const rCls = Rr.cols.map((c, jj) => (refs.has(Lw + jj) ? 'chk' : ''));
    const cond = on ? exprParts(src, on) : null;
    const hl = [j.span], hl2 = j.onSpan ? [j.onSpan] : [];
    const crumbLabel = `${j.label} ${Rit.table || Rit.alias}`;
    const nl = L.rows.length, nr = Rr.rows.length;
    const lSpec = o => tableSpec(L, Object.assign({ qual: Lqual, colCls: lCls, cls: L.tag === 'temporary' ? 'temp' : '' }, o));
    const rSpec = o => tableSpec(Rr, Object.assign({ colCls: rCls, cls: Rr.tag ? 'temp' : '' }, o));
    const gid = `grid${JR.rid}`;
    const lname = Lqual ? 'row on the left' : `${Ltitle} row`;

    if (j.kind === 'CROSS') {
      push(ctx, 'JOIN', {
        crumbLabel, hl, left: [lSpec({}), rSpec({})],
        right: [gridOf(L, Ltitle, Rr, Rit.alias, () => 'p', -1, `${nl} × ${nr} = ${nl * nr}, all kept`, gid), tableSpec(JR, { qual: true, cls: 'out' })],
        caption: `${nl} × ${nr} = ${nl * nr} rows, all kept`, leftLabel: 'CROSS JOIN inputs', rightLabel: 'every combination',
      });
      return JR;
    }
    push(ctx, 'JOIN', {
      crumbLabel, hl, hl2, left: [lSpec({}), rSpec({})],
      right: [gridOf(L, Ltitle, Rr, Rit.alias, () => 'n', -1, `${nl} × ${nr} = ${nl * nr} pairs to check`, gid)],
      caption: 'Which pairs match?',
      leftLabel: `${j.label} inputs`, rightLabel: 'pairs',
    });
    let kept = 0;
    for (let i = 0; i < nl; i++) {
      kept += pass[i].filter(Boolean).length;
      const ok = pass[i].filter(Boolean).length;
      const partialRel = Object.assign({}, JR, { rows: matchedOnly.slice(0, kept) });
      push(ctx, 'JOIN', {
        crumbLabel, hl, hl2,
        left: [
          lSpec({ rowCls: (r, ii) => (ii === i ? 'active' : 'pending'), cellCls: (r, ii, jj) => (ii === i && refs.has(jj) ? 'chk2' : ''), pointer: Lqual ? 'row' : Ltitle }),
          rSpec({ rowCls: (r, jj) => (pass[i][jj] ? 'pass' : 'fail'), cellCls: (r, jj, c) => (refs.has(Lw + c) ? 'chk2' : ''), mark: (r, jj) => (pass[i][jj] ? 'yes' : 'no') }),
        ],
        right: [
          gridOf(L, Ltitle, Rr, Rit.alias, (ii, jj) => (ii <= i ? (pass[ii][jj] ? 'p' : 'f') : 'n'), i, `${kept} of ${(i + 1) * nr} pairs match so far`, gid),
          kept ? tableSpec(partialRel, { qual: true, cls: 'out' }) : placeholder(''),
        ],
        caption: `${rowLabel(L, L.rows[i])}: ${ok ? `${ok} match${ok > 1 ? 'es' : ''}` : 'no match'}`,
        leftLabel: `fix one ${lname}, try every ${Rit.alias} row`, rightLabel: 'matching pairs so far',
      });
    }
    if (outerL || outerR) {
      const lostL = L.rows.filter((_, i) => !lHit[i]).map(r => rowLabel(L, r));
      const lostR = Rr.rows.filter((_, jj) => !rHit[jj]).map(r => rowLabel(Rr, r));
      const lost = (outerL ? lostL : []).concat(outerR ? lostR : []);
      const side = j.kind === 'LEFT' ? `the left side (${Ltitle})` : j.kind === 'RIGHT' ? `the right side (${Rit.alias})` : 'both sides';
      push(ctx, 'JOIN', {
        crumbLabel, hl, hl2,
        left: [
          lSpec({ rowCls: (r, i) => (outerL && !lHit[i] ? 'nomatch' : ''), mark: (r, i) => (outerL && !lHit[i] ? 'nomatch' : null) }),
          rSpec({ rowCls: (r, jj) => (outerR && !rHit[jj] ? 'nomatch' : ''), mark: (r, jj) => (outerR && !rHit[jj] ? 'nomatch' : null) }),
        ],
        right: [
          gridOf(L, Ltitle, Rr, Rit.alias, (ii, jj) => (pass[ii][jj] ? 'p' : 'f'), -1, `${matchedOnly.length} matching pairs`, gid),
          tableSpec(JR, { qual: true, cls: 'out', rowCls: r => (r.padded ? 'padded' : '') }),
        ],
        caption: lost.length ? `No match: ${lost.join(', ')} → kept with NULL` : 'Every row matched: nothing to pad',
        leftLabel: 'rows with no match', rightLabel: `${j.label} output`,
      });
    }
    return JR;
  }

  /* ===== WHERE ===== */
  let R1 = R0;
  if (q.where) {
    CUR.clause = 'WHERE';
    const w = q.where;
    const refs = refCols(w);
    const pass = R0.rows.map(r => evalE(w, r.vals, null) === true);
    R1 = {
      rid: newRid('W'), title: two ? `${items[0].alias} × ${items[1].alias}` : R0.title, badge: two ? null : R0.badge,
      tag: two ? null : (R0.tag === 'temporary' ? 'temporary' : null),
      cols: R0.cols,
      rows: R0.rows.filter((r, i) => pass[i]).map(r => ({ key: r.key, vals: r.vals, src: r.vals.map((_, j) => srcOf(R0, r, j)), orig: r })),
    };
    const condParts = exprParts(src, w);
    const whereCaption = `Keep ${two ? 'combinations' : 'rows'} where the condition is true`;
    const partial = n => Object.assign({}, R1, { rows: R1.rows.slice(0, n) });

    if (!two) {
      const colCls = R0.cols.map((c, j) => (refs.has(j) ? 'chk' : ''));
      push(ctx, 'WHERE', {
        hl: [S.where], left: [tableSpec(R0, { qual: multi, colCls })], right: [placeholder('?')],
        caption: 'Which rows pass?',
      });
      if (ctx.T.opts.rowByRow) {
        let kept = 0;
        R0.rows.forEach((r, i) => {
          if (pass[i]) kept++;
          const v = evalE(w, r.vals, null);
          push(ctx, 'WHERE', {
            hl: [S.where],
            left: [tableSpec(R0, { qual: multi,
              colCls,
              rowCls: (rr, ii) => (ii === i ? 'active' : ii < i ? (pass[ii] ? 'pass' : 'fail') : 'pending'),
              cellCls: (rr, ii, j) => (ii === i && refs.has(j) ? 'chk2' : ''),
              mark: (rr, ii) => (ii <= i ? (pass[ii] ? 'yes' : 'no') : null),
              badge: R0.badge,
            })],
            right: [kept ? tableSpec(partial(kept), { qual: multi, cls: 'out' }) : placeholder('')],
            caption: null,
            test: `${substText(src, w, r.vals)} → ${v === null ? 'UNKNOWN' : v ? 'TRUE' : 'FALSE'}`, testOk: v === true,
            leftLabel: 'WHERE checks one row at a time', rightLabel: 'rows kept so far',
          });
        });
      } else {
        const marked = tableSpec(R0, { qual: multi,
          colCls, rowCls: (r, i) => (pass[i] ? 'pass' : 'fail'), mark: (r, i) => (pass[i] ? 'yes' : 'no'),
        });
        const nKeep = pass.filter(Boolean).length;
        push(ctx, 'WHERE', {
          hl: [S.where], left: [marked], right: [placeholder('?')],
          caption: `${nKeep} of ${R0.rows.length} rows pass`,
          leftLabel: 'WHERE checks each row', rightLabel: '',
        });
        push(ctx, 'WHERE', {
          hl: [S.where], left: [marked], right: [R1.rows.length ? tableSpec(R1, { qual: multi, cls: 'out' }) : tableSpec(R1, { qual: multi, cls: 'out', empty: 'no rows pass' })],
          caption: null,
          leftLabel: 'WHERE checks each row', rightLabel: 'WHERE output',
        });
      }
    } else {
      const [A, B] = items;
      const na = A.rel.rows.length, nb = B.rel.rows.length;
      const pairPass = (i, j) => pass[i * nb + j];
      const colClsFor = it => it.cols.map((c, j) => (refs.has(it.offset + j) ? 'chk' : ''));
      const survivorsUpTo = i => { let c = 0; for (let k = 0; k < (i + 1) * nb; k++) if (pass[k]) c++; return c; };
      push(ctx, 'WHERE', {
        hl: [S.where],
        left: [tableSpec(A.rel, { colCls: colClsFor(A), cls: A.rel.tag ? 'temp' : '' }), tableSpec(B.rel, { colCls: colClsFor(B), cls: B.rel.tag ? 'temp' : '' })],
        right: [gridSpec(A, B, () => 'n', -1, `${na * nb} combinations to check`)],
        caption: 'Which combinations pass?',
      });
      for (let i = 0; i < na; i++) {
        const nSurv = survivorsUpTo(i);
        const ok = [];
        for (let j = 0; j < nb; j++) if (pairPass(i, j)) ok.push(j);
        push(ctx, 'WHERE', {
          hl: [S.where],
          left: [
            tableSpec(A.rel, {
              colCls: colClsFor(A), cls: A.rel.tag ? 'temp' : '',
              rowCls: (r, ii) => (ii === i ? 'active' : 'pending'),
              cellCls: (r, ii, j) => (ii === i && refs.has(A.offset + j) ? 'chk2' : ''),
              pointer: A.alias,
            }),
            tableSpec(B.rel, {
              colCls: colClsFor(B), cls: B.rel.tag ? 'temp' : '',
              rowCls: (r, jj) => (pairPass(i, jj) ? 'pass' : 'fail'),
              cellCls: (r, jj, j) => (refs.has(B.offset + j) ? 'chk2' : ''),
              mark: (r, jj) => (pairPass(i, jj) ? 'yes' : 'no'),
            }),
          ],
          right: [
            gridSpec(A, B, (ii, jj) => (ii < i ? (pairPass(ii, jj) ? 'p' : 'f') : ii === i ? (pairPass(ii, jj) ? 'p' : 'f') : 'n'), i,
              `${nSurv} of ${(i + 1) * nb} checked so far pass`),
            nSurv ? tableSpec(partial(nSurv), { qual: true, cls: 'out' }) : placeholder(''),
          ],
          caption: `${rowLabel(A.rel, A.rel.rows[i])}: ${ok.length ? `${ok.length} match${ok.length > 1 ? 'es' : ''}` : 'no match'}`,
          leftLabel: `fix one ${A.alias} row, try every ${B.alias} row`, rightLabel: 'combinations kept so far',
          pointerAlias: A.alias,
        });
      }
    }
  }

  /* ===== GROUP BY / aggregation / SELECT ===== */
  let OUT;
  const qualIn = multi;
  if (isAgg) {
    CUR.clause = 'SELECT';
    const aggNodes = [];
    const seenAgg = new Set();
    const addAggs = n => walk(n, x => { if (x.type === 'agg') { const t = text(src, x).toLowerCase(); if (!seenAgg.has(t)) { seenAgg.add(t); aggNodes.push(x); } } });
    q.selectItems.forEach(s => addAggs(s.expr));
    orderKeys.forEach(k => { if (k.expr) addAggs(k.expr); });
    const aggArgCols = new Set();
    let countStar = false;
    aggNodes.forEach(a => { if (a.arg === '*') countStar = true; else refCols(a.arg).forEach(c => aggArgCols.add(c)); });
    const aggHl = aggNodes.map(a => [a.s, a.e]);

    let groups;
    if (q.groupBy.length) {
      CUR.clause = 'GROUP BY';
      const gmap = new Map();
      groups = [];
      R1.rows.forEach(r => {
        const gk = JSON.stringify(q.groupBy.map(g => r.vals[g.idx]));
        let g = gmap.get(gk);
        if (!g) { g = { key: `g${groups.length}`, color: groups.length % GROUP_COLORS, rows: [], label: q.groupBy.map(gg => `${gg.name} = ${fmt(r.vals[gg.idx])}`).join(', ') }; gmap.set(gk, g); groups.push(g); }
        g.rows.push(r);
      });
      const gOf = new Map();
      groups.forEach(g => g.rows.forEach(r => gOf.set(r.key, g)));
      const grpCols = R1.cols.map((c, j) => (groupIdx.has(j) ? 'grp' : ''));
      push(ctx, 'GROUP BY', {
        hl: [S.group], left: [tableSpec(R1, { colCls: grpCols, qual: qualIn })], right: [placeholder('?')],
        caption: 'Which rows belong together?',
        leftLabel: 'GROUP BY input', rightLabel: '',
      });
      groups.forEach(g => {
        g.rel = { rid: newRid('G'), title: g.label, cols: R1.cols, rows: g.rows.map(r => ({ key: r.key, vals: r.vals, src: r.vals.map((_, j) => ck(R1, r, j)) })) };
      });
      const partSpecs = (o = {}) => groups.map(g => tableSpec(g.rel, Object.assign({ qual: qualIn, color: g.color, cls: 'group', colCls: grpCols, rowCls: () => `g${g.color}` }, o)));
      push(ctx, 'GROUP BY', {
        hl: [S.group],
        left: [tableSpec(R1, { colCls: grpCols, qual: qualIn, rowCls: r => `g${gOf.get(r.key).color}` })],
        right: partSpecs(),
        caption: `${groups.length} group${groups.length === 1 ? '' : 's'}`,
        leftLabel: 'GROUP BY input', rightLabel: 'groups',
      });
      CUR.clause = 'SELECT';
      const aggCols = R1.cols.map((c, j) => (aggArgCols.has(j) ? 'agg' : groupIdx.has(j) ? 'grp' : ''));
      const groupsLeft = () => groups.map(g => tableSpec(g.rel, { qual: qualIn, color: g.color, cls: 'group', colCls: aggCols, rowCls: () => `g${g.color} ${countStar ? 'aggrow' : ''}` }));
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: groupsLeft(), right: [placeholder('?')],
        caption: 'One aggregate per group',
        leftLabel: 'groups', rightLabel: '',
      });
      groups.forEach(g => { g.aggs = aggNodes.map(a => ({ node: a, r: aggregate(a, g.rows.map(r => r.vals)) })); });
      const boxes = (phase) => groups.flatMap(g => g.aggs.map((ga, ai) => aggBox(ga.node, ga.r, g.rel, g.rows, phase, g.color, g.label, `${g.key}a${ai}`)));
      const anyDup = groups.some(g => g.aggs.some(ga => ga.r.dup.length));
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: groupsLeft(), right: boxes('gather'),
        caption: null, leftLabel: 'groups', rightLabel: 'aggregate, per group',
      });
      if (anyDup) push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: groupsLeft(), right: boxes('dedupe'),
        caption: 'Repeated values ignored', leftLabel: 'groups', rightLabel: 'aggregate, per group',
      });
      OUT = {
        rid: newRid('O'), title: 'result', cols: outCols, fmts: outFmts,
        rows: groups.map(g => ({
          key: g.key, grp: g.rows.map(r => r.vals), color: g.color,
          vals: q.selectItems.map(s => evalE(s.expr, g.rows[0].vals, g.rows.map(r => r.vals))),
          src: q.selectItems.map(s => {
            if (s.expr.type === 'agg') { const ai = aggNodes.findIndex(a => text(src, a).toLowerCase() === text(src, s.expr).toLowerCase()); return `aggres|${g.key}a${ai}`; }
            if (s.expr.type === 'col') return ck(g.rel, g.rel.rows[0], s.expr.idx);
            return null;
          }),
        })),
      };
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: groupsLeft(), right: boxes('collapse').concat([tableSpec(OUT, { rowCls: r => `g${r.color}`, cls: 'out' })]),
        caption: 'One row per group', leftLabel: 'groups', rightLabel: 'one row per group',
      });
    } else {
      /* aggregation over the whole relation */
      const aggCols = R1.cols.map((c, j) => (aggArgCols.has(j) ? 'agg' : ''));
      const leftSpec = () => tableSpec(R1, { colCls: aggCols, qual: qualIn, rowCls: () => (countStar ? 'aggrow' : '') });
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: [leftSpec()], right: [placeholder('?')],
        caption: 'Uses the whole column, not one row at a time', leftLabel: 'SELECT input', rightLabel: '',
        leftLabel: 'SELECT input', rightLabel: '',
      });
      const rowsV = R1.rows.map(r => r.vals);
      const results = aggNodes.map(a => aggregate(a, rowsV));
      const boxes = phase => aggNodes.map((a, ai) => aggBox(a, results[ai], R1, R1.rows, phase, null, null, `all${ai}`));
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: [leftSpec()], right: boxes('gather'),
        caption: null, leftLabel: 'SELECT input', rightLabel: 'aggregate',
      });
      if (results.some(r => r.dup.length)) push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: [leftSpec()], right: boxes('dedupe'),
        caption: 'Repeated values ignored', leftLabel: 'SELECT input', rightLabel: 'aggregate',
      });
      OUT = {
        rid: newRid('O'), title: 'result', cols: outCols, fmts: outFmts,
        rows: [{
          key: 'all', grp: rowsV,
          vals: q.selectItems.map(s => evalE(s.expr, rowsV[0] || [], rowsV)),
          src: q.selectItems.map(s => {
            if (s.expr.type === 'agg') { const ai = aggNodes.findIndex(a => text(src, a).toLowerCase() === text(src, s.expr).toLowerCase()); return `aggres|all${ai}`; }
            return null;
          }),
        }],
      };
      push(ctx, 'SELECT', {
        hl: selHl, hl2: aggHl, left: [leftSpec()], right: boxes('collapse').concat([tableSpec(OUT, { cls: 'out' })]),
        caption: `${R1.rows.length} ${countStar && !aggArgCols.size ? 'rows' : 'values'} → 1 value`, leftLabel: 'SELECT input', rightLabel: 'one row',
      });
    }
  } else {
    CUR.clause = 'SELECT';
    const selRefs = new Set();
    if (q.star) R1.cols.forEach((c, j) => selRefs.add(j));
    else q.selectItems.forEach(s => refCols(s.expr).forEach(c => selRefs.add(c)));
    const colCls = R1.cols.map((c, j) => (selRefs.has(j) ? 'sel' : 'drop'));
    OUT = {
      rid: newRid('O'), title: 'result', cols: outCols, fmts: outFmts,
      rows: R1.rows.map(r => ({
        key: r.key, ctxRow: r.vals,
        vals: q.star ? r.vals.slice() : q.selectItems.map(s => evalE(s.expr, r.vals, null)),
        src: q.star ? r.vals.map((_, j) => srcOf(R1, r, j)) : q.selectItems.map(s => (s.expr.type === 'col' ? srcOf(R1, r, s.expr.idx) : null)),
      })),
    };
    const leftSel = tableSpec(R1, { colCls, qual: qualIn });
    push(ctx, 'SELECT', {
      hl: selHl, left: [leftSel], right: [placeholder('?')],
      caption: null,
      leftLabel: 'SELECT input', rightLabel: '',
    });
    push(ctx, 'SELECT', {
      hl: selHl, left: [leftSel], right: [tableSpec(OUT, { cls: 'out', empty: 'no rows' })],
      caption: null,
      leftLabel: 'SELECT input', rightLabel: 'SELECT output',
    });
  }

  /* ===== DISTINCT ===== */
  const rowColor = r => (r.color !== undefined ? `g${r.color}` : '');
  if (q.distinct) {
    CUR.clause = 'SELECT';
    const sig = r => JSON.stringify(r.vals);
    const counts = new Map();
    OUT.rows.forEach(r => counts.set(sig(r), (counts.get(sig(r)) || 0) + 1));
    const dupColor = new Map();
    let ci = 0;
    OUT.rows.forEach(r => { const s = sig(r); if (counts.get(s) > 1 && !dupColor.has(s)) dupColor.set(s, ci++ % GROUP_COLORS); });
    const firstSeen = new Set();
    const isRepeat = OUT.rows.map(r => { const s = sig(r); if (firstSeen.has(s)) return true; firstSeen.add(s); return false; });
    const tint = r => (dupColor.has(sig(r)) ? `g${dupColor.get(sig(r))}` : '');
    const dupCount = isRepeat.filter(Boolean).length;
    push(ctx, 'DISTINCT', {
      hl: [S.distinct], left: [tableSpec(OUT, { rowCls: tint })], right: [placeholder('?')],
      caption: dupCount ? 'Same colour = duplicate rows' : 'No duplicates',
      leftLabel: 'a bag: duplicates allowed', rightLabel: '',
    });
    const DOUT = {
      rid: newRid('D'), title: 'result', cols: OUT.cols, fmts: OUT.fmts,
      rows: OUT.rows.filter((r, i) => !isRepeat[i]).map(r => Object.assign({}, r, { src: r.vals.map((_, j) => ck(OUT, r, j)) })),
    };
    push(ctx, 'DISTINCT', {
      hl: [S.distinct],
      left: [tableSpec(OUT, { rowCls: (r, i) => `${tint(r)} ${isRepeat[i] ? 'fail' : ''}`, mark: (r, i) => (isRepeat[i] ? 'dup' : null) })],
      right: [tableSpec(DOUT, { rowCls: tint, cls: 'out' })],
      caption: `${OUT.rows.length} rows → ${DOUT.rows.length} rows`,
      leftLabel: 'a bag: duplicates allowed', rightLabel: 'a set: each row once',
    });
    OUT = DOUT;
  }

  /* ===== ORDER BY ===== */
  if (orderKeys.length) {
    CUR.clause = 'ORDER BY';
    const ghosts = [];
    const keyVals = OUT.rows.map(r => orderKeys.map(k => {
      if (k.out !== undefined) return r.vals[k.out];
      return isAgg ? evalE(k.expr, (r.grp[0] || []), r.grp) : evalE(k.expr, r.ctxRow, null);
    }));
    orderKeys.forEach((k, ki) => {
      if (k.out === undefined) ghosts.push({ id: ki, label: text(src, k.n), vals: keyVals.map(kv => fmt(kv[ki])) });
    });
    const sortCls = OUT.cols.map((c, j) => (orderKeys.some(k => k.out === j) ? 'sort' : ''));
    const cmp = (a, b) => {
      for (let ki = 0; ki < orderKeys.length; ki++) {
        const x = keyVals[a][ki], y = keyVals[b][ki];
        let c = 0;
        if (x === null && y === null) c = 0; else if (x === null) c = 1; else if (y === null) c = -1;
        else c = x < y ? -1 : x > y ? 1 : 0;
        if (orderKeys[ki].dir === 'DESC') c = -c;
        if (c) return c;
      }
      return a - b;
    };
    const order = OUT.rows.map((_, i) => i).sort(cmp);
    const dirText = orderKeys.map(k => `${text(src, k.n)} ${k.dir === 'DESC' ? '↓ DESC' : '↑ ASC'}`).join(', then ');
    push(ctx, 'ORDER BY', {
      hl: [S.order], left: [tableSpec(OUT, { colCls: sortCls, ghost: ghosts, rowCls: rowColor })], right: [placeholder('?')],
      caption: null, leftLabel: 'current order', rightLabel: '',
    });
    const SOUT = {
      rid: newRid('S'), title: 'result', cols: OUT.cols, fmts: OUT.fmts,
      rows: order.map(i => Object.assign({}, OUT.rows[i], { src: OUT.rows[i].vals.map((_, j) => ck(OUT, OUT.rows[i], j)) })),
    };
    const sGhosts = ghosts.map(g => ({ id: g.id, label: g.label, vals: order.map(i => g.vals[i]), from: order.map(i => `${OUT.rid}|${OUT.rows[i].key}|g${g.id}`) }));
    push(ctx, 'ORDER BY', {
      hl: [S.order], left: [tableSpec(OUT, { colCls: sortCls, ghost: ghosts, rowCls: rowColor })],
      right: [tableSpec(SOUT, { colCls: sortCls, ghost: sGhosts, rowCls: rowColor, cls: 'out' })],
      caption: null, leftLabel: 'current order', rightLabel: 'sorted',
    });
    OUT = SOUT;
  }

  /* ===== RESULT ===== */
  const finalSpec = o => tableSpec(OUT, Object.assign({ rowCls: rowColor, empty: 'no rows' }, o));
  if (ctx.kind === 'main') {
    push(ctx, 'RESULT', {
      hl: [], left: sourceSpecs(), right: [finalSpec({ cls: 'final', tag: null, title: 'Result' })],
      caption: `${OUT.rows.length} row${OUT.rows.length === 1 ? '' : 's'}`, leftLabel: 'from these tables', rightLabel: 'final output',
    });
  } else if (ctx.kind === 'from') {
    OUT = Object.assign({}, OUT, { title: ctx.alias, tag: 'temporary' });
    push(ctx, 'RESULT', {
      crumbLabel: `= ${ctx.alias}`,
      hl: [], left: sourceSpecs(), right: [finalSpec({ cls: 'temp', title: ctx.alias, tag: 'temporary' })],
      caption: null, leftLabel: 'subquery input', rightLabel: 'temporary table',
    });
  } else {
    const oneVal = OUT.rows.length === 1 && OUT.cols.length === 1;
    push(ctx, 'RESULT', {
      crumbLabel: '= value',
      hl: [], left: sourceSpecs(), right: [finalSpec({ cls: 'temp', title: 'subquery result', tag: oneVal ? 'one value' : null })],
      caption: oneVal ? 'One row, one column → a single value' : null,
      leftLabel: 'subquery input', rightLabel: 'used as a value',
    });
  }
  return OUT;

  /* aggregate box spec */
  function aggBox(node, r, rel, rows, phase, color, groupLabel, id) {
    const chips = rows.map((row, i) => {
      const isStar = node.arg === '*';
      const j = isStar ? 0 : [...refCols(node.arg)][0];
      const v = isStar ? '●' : fmt(r.vals[i]);
      const f = j === undefined ? null : ck(rel, row, j);
      let cls = '';
      if (r.vals[i] === null) cls = 'null';
      if (phase !== 'gather' && r.dup.includes(i)) cls = 'dup';
      if (phase === 'collapse' && cls !== 'dup') cls = 'gone';
      if ((node.fn === 'MIN' || node.fn === 'MAX') && phase === 'collapse' && r.vals[i] === r.value) cls = 'winner';
      return { v, k: `chip|${id}|${i}`, f, cls };
    });
    return {
      kind: 'agg', id, title: text(src, node), color, group: groupLabel, chips,
      formula: phase === 'collapse' ? r.formula : null,
      result: phase === 'collapse' ? fmt(r.value, r.kind) : null, rk: `aggres|${id}`,
    };
  }
}

/* ======================= DML: UPDATE / DELETE ======================= */
function ruleFor(opts, fk, kind) {
  const r = (opts.rules || {})[`${fk.child}.${fk.col}`];
  return (r && r[kind]) || 'RESTRICT';
}
function traceDML(q, ctx) {
  const T = ctx.T, src = T.src, opts = T.opts;
  const isDel = q.kind === 'delete';
  const verb = isDel ? 'DELETE' : 'UPDATE';
  const tname = Object.keys(DB).find(k => k.toLowerCase() === q.table.toLowerCase());
  if (!tname) throw new SqlError(`There is no table called "${q.table}". Tables: ${Object.keys(DB).join(', ')}.`, verb, q.nameSpan[0], q.nameSpan[1]);
  const alias = q.alias || tname;
  const cols = DB[tname].cols;

  /* bind columns of the target table */
  function bindT(n, clause) {
    walk(n, x => {
      if (x.type === 'agg') throw new SqlError(`Aggregates like ${text(src, x)} can't be used in ${clause} here`, clause, x.s, x.e);
      if (x.type === 'col') {
        if (x.q && x.q.toLowerCase() !== alias.toLowerCase() && x.q.toLowerCase() !== tname.toLowerCase())
          throw new SqlError(`Unknown table or tuple variable "${x.q}". This statement only uses ${tname}.`, clause, x.s, x.e);
        const i = cols.findIndex(c => c.toLowerCase() === x.name.toLowerCase());
        if (i < 0) throw new SqlError(`${tname} has no column "${x.name}". Its columns: ${cols.join(', ')}.`, clause, x.s, x.e);
        x.idx = i;
      }
    });
    let hasSub = false;
    (function rec(x) { if (!x || x === '*') return; if (x.type === 'sub') hasSub = true; if (x.type === 'bin') { rec(x.l); rec(x.r); } else if (x.x) rec(x.x); })(n);
    if (hasSub) throw new SqlError('Subqueries inside UPDATE/DELETE are not supported in this tool.', clause, n.s, n.e);
  }
  if (q.where) bindT(q.where, 'WHERE');
  if (!isDel) q.sets.forEach(s => { bindT(s.col, 'SET'); bindT(s.expr, 'SET'); });

  /* working state: one relation per table, replaced (never mutated) as things change */
  const cur = {}, before = {};
  const rel = t => cur[t] || (cur[t] = before[t] = baseRel(t, t, false));
  const touched = [];
  const touch = t => { if (!touched.includes(t)) touched.push(t); };
  const next = (t, rows, tag) => {
    const old = rel(t);
    cur[t] = Object.assign({}, old, { rid: newRid('M'), tag: tag || null, rows: rows.map(r => Object.assign({}, r, { src: r.vals.map((_, j) => (r.srcKey ? `${old.rid}|${r.srcKey}|${j}` : ck(old, r, j))) })) });
    touch(t);
    return cur[t];
  };
  const target0 = rel(tname);
  touch(tname);
  CUR.clause = 'WHERE';
  const match = target0.rows.map(r => (q.where ? evalE(q.where, r.vals, null) === true : true));
  const hitRows = target0.rows.filter((r, i) => match[i]);
  const whereRefs = q.where ? refCols(q.where) : new Set();
  const fkKeyOf = fk => `${fk.child}.${fk.col}`;
  const hlHead = [q.spans.head];

  push(ctx, 'FROM', {
    crumbLabel: isDel ? `FROM ${tname}` : `UPDATE ${tname}`, hl: hlHead,
    left: [tableSpec(target0, { titleHl: 'from' })], right: [placeholder()], caption: null,
  });
  if (q.where) {
    const colCls = cols.map((c, j) => (whereRefs.has(j) ? 'chk' : ''));
    push(ctx, 'WHERE', { hl: [q.spans.where], left: [tableSpec(target0, { colCls })], right: [placeholder('?')], caption: `Which rows get ${isDel ? 'deleted' : 'updated'}?` });
    push(ctx, 'WHERE', {
      hl: [q.spans.where], right: [placeholder('?')],
      left: [tableSpec(target0, { colCls, rowCls: (r, i) => (match[i] ? (isDel ? 'doomed' : 'target') : 'fail'), mark: (r, i) => (match[i] ? 'yes' : 'no') })],
      caption: `${hitRows.length} of ${target0.rows.length} rows match`,
    });
  }

  let rejected = null;
  const events = [];

  if (isDel) {
    /* ---- DELETE + referential actions ---- */
    const afterT = next(tname, target0.rows.filter((r, i) => !match[i]));
    push(ctx, 'DELETE', {
      hl: [q.spans.head],
      left: [tableSpec(target0, { rowCls: (r, i) => (match[i] ? 'doomed' : ''), mark: (r, i) => (match[i] ? 'del' : null) })],
      right: [tableSpec(afterT, { cls: 'out' })],
      caption: hitRows.length ? `${hitRows.length} row${hitRows.length > 1 ? 's' : ''} removed from ${tname}` : 'No rows match: nothing to delete',
    });
    /* follow foreign keys that point at deleted rows, depth-first */
    const cascadeDelete = (parent, goneRows, depth, parentBefore) => {
      if (rejected || depth > 8) return;
      for (const fk of FKS.filter(f => f.parent === parent)) {
        const pci = DB[parent].cols.indexOf(fk.pcol);
        const goneVals = new Set(goneRows.map(r => r.vals[pci]));
        const still = new Set(rel(parent).rows.map(r => r.vals[pci]));
        still.forEach(v => goneVals.delete(v));
        const child = rel(fk.child);
        const cci = DB[fk.child].cols.indexOf(fk.col);
        const refRows = child.rows.filter(r => r.vals[cci] !== null && goneVals.has(r.vals[cci]));
        if (!refRows.length) continue;
        const rule = ruleFor(opts, fk, 'del');
        const ev = { fk, rule, before: child, refKeys: new Set(refRows.map(r => r.key)), cci, vals: [...new Set(refRows.map(r => r.vals[cci]))], parentBefore, parentMark: new Set(goneRows.map(r => r.key)), pci };
        events.push(ev);
        if (rule === 'RESTRICT') { rejected = ev; return; }
        if (rule === 'CASCADE') {
          ev.after = next(fk.child, child.rows.filter(r => !ev.refKeys.has(r.key)));
          cascadeDelete(fk.child, refRows, depth + 1, child);
          if (rejected) return;
        } else {
          ev.after = next(fk.child, child.rows.map(r => (ev.refKeys.has(r.key) ? Object.assign({}, r, { vals: r.vals.map((v, j) => (j === cci ? null : v)) }) : r)));
        }
      }
    };
    cascadeDelete(tname, hitRows, 0, target0);
  } else {
    /* ---- UPDATE + referential actions ---- */
    CUR.clause = 'SET';
    const setIdx = q.sets.map(s => s.col.idx);
    const newVals = target0.rows.map((r, i) => {
      if (!match[i]) return r.vals;
      const v = r.vals.slice();
      q.sets.forEach(s => { v[s.col.idx] = evalE(s.expr, r.vals, null); });
      return v;
    });
    const changed = (i, j) => match[i] && setIdx.includes(j) && newVals[i][j] !== target0.rows[i].vals[j];
    const afterRows = target0.rows.map((r, i) => Object.assign({}, r, { vals: newVals[i] }));
    const afterT = next(tname, afterRows);
    const showChange = Object.assign({}, afterT, {
      rows: afterT.rows.map((r, i) => Object.assign({}, r, { vals: r.vals.map((v, j) => (changed(i, j) ? `${fmt(target0.rows[i].vals[j])} → ${fmt(v)}` : v)) })),
    });
    const setCls = cols.map((c, j) => (setIdx.includes(j) ? 'setcol' : ''));
    const nChanged = target0.rows.reduce((a, r, i) => a + cols.filter((c, j) => changed(i, j)).length, 0);
    push(ctx, 'SET', {
      hl: [q.spans.set],
      left: [tableSpec(target0, { colCls: setCls, rowCls: (r, i) => (match[i] ? 'target' : 'fail') })],
      right: [tableSpec(showChange, { cls: 'out', cellCls: (r, i, j) => (changed(i, j) ? 'changed' : '') })],
      caption: nChanged ? `${nChanged} value${nChanged > 1 ? 's' : ''} change` : 'Nothing changes',
    });
    /* 1) updated foreign-key columns must still point at an existing parent */
    for (const fk of FKS.filter(f => f.child === tname)) {
      const cci = cols.indexOf(fk.col);
      if (!setIdx.includes(cci)) continue;
      const pci = DB[fk.parent].cols.indexOf(fk.pcol);
      const parentVals = new Set(rel(fk.parent).rows.map(r => r.vals[pci]));
      const bad = afterT.rows.filter((r, i) => changed(i, cci) && r.vals[cci] !== null && !parentVals.has(r.vals[cci]));
      if (bad.length) {
        rejected = { fk, rule: 'FOREIGN KEY', check: true, badVals: [...new Set(bad.map(r => r.vals[cci]))], badKeys: new Set(bad.map(r => r.key)) };
        events.push(rejected);
        break;
      }
    }
    /* 2) changed keys that other tables reference: ON UPDATE rule */
    const cascadeUpdate = (parent, pcolIdx, map, depth, parentShow, parentMark) => {
      if (rejected || depth > 8) return;
      const pcol = DB[parent].cols[pcolIdx];
      for (const fk of FKS.filter(f => f.parent === parent && f.pcol === pcol)) {
        const child = rel(fk.child);
        const cci = DB[fk.child].cols.indexOf(fk.col);
        const refRows = child.rows.filter(r => r.vals[cci] !== null && map.has(r.vals[cci]));
        if (!refRows.length) continue;
        const rule = ruleFor(opts, fk, 'upd');
        const ev = { fk, rule, before: child, refKeys: new Set(refRows.map(r => r.key)), cci, vals: [...new Set(refRows.map(r => r.vals[cci]))], map, parentBefore: parentShow, parentMark, pci: pcolIdx, upd: true };
        events.push(ev);
        if (rule === 'RESTRICT') { rejected = ev; return; }
        const rows = child.rows.map(r => (ev.refKeys.has(r.key) ? Object.assign({}, r, { vals: r.vals.map((v, j) => (j === cci ? (rule === 'CASCADE' ? map.get(v) : null) : v)) }) : r));
        ev.after = next(fk.child, rows);
        if (rule === 'CASCADE') cascadeUpdate(fk.child, cci, map, depth + 1, ev.after, ev.refKeys);
      }

/* ---------------- editor ---------------- */
function editorHtml(src, step, err) {

    if (t.t === 'kw') add(t.s, t.e, 'tk-k');
    else if (t.t === 'id' && /^(COUNT|AVG|SUM|MIN|MAX)$/i.test(t.v) && toks[ti + 1] && toks[ti + 1].v === '(') add(t.s, t.e, 'tk-f');
    else if (t.t === 'str') add(t.s, t.e, 'tk-s');
    else if (t.t === 'num') add(t.s, t.e, 'tk-n');
    else if (t.t === 'comment') add(t.s, t.e, 'tk-c');

  if (step) {
    const sc = STAGE_CLS[step.stage];

    (step.hl2 || []).forEach(sp => sp && add(sp[0], sp[1], 'h2'));

  for (let i = 0; i < n; i++) {
    const c = src[i] === '\n' ? '' : cls[i];
    if (c !== cur) { flush(); cur = c; }
    buf += src[i];
  }
  flush();
  if (err && err.s !== undefined && err.s >= n) html += '<span class="err"> </span>';
  return html + '\n ';
}
